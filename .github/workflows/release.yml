name: Release candidate

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate (no publication)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Check version and changelog consistency
        run: node scripts/release-check.mjs
      - name: Install npm workspaces
        run: npm ci --no-audit --no-fund
      - name: Verify TypeScript, tests and production builds
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run start --workspace @psa/example-consumer
      - name: Install locked Python dependencies
        run: python -m pip install --requirement apps/lab-api/requirements-test.lock
      - name: Verify Python quality and API behavior
        working-directory: apps/lab-api
        run: |
          ruff format --check app tests
          ruff check app tests
          python -m pytest -q

      - name: Assemble source and build outputs
        run: |
          mkdir -p release-bundle
          git archive --format=tar.gz --output=release-bundle/password-security-laboratory-source.tar.gz HEAD
          cp -R apps/web/dist release-bundle/web-dist
          cp -R packages/core/dist release-bundle/sdk-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: password-security-laboratory-${{ github.ref_name }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 14

      # This workflow is a preflight only. It does not create a public release,
      # publish a package or deploy the laboratory.
