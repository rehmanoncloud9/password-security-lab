name: CI

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/lab-api/requirements-test.lock
      - name: Install locked Python dependencies
        run: python -m pip install --requirement apps/lab-api/requirements-test.lock
      - name: Check Python formatting
        working-directory: apps/lab-api
        run: ruff format --check app tests
      - name: Lint Python
        working-directory: apps/lab-api
        run: ruff check app tests
      - name: Run Python unit and API integration tests
        working-directory: apps/lab-api
        run: python -m pytest -q

  javascript:
    name: TypeScript core, web and SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked npm workspaces
        run: npm ci --no-audit --no-fund
      - name: Check privacy and architecture boundaries
        run: npm run lint
      - name: Type check workspaces
        run: npm run typecheck
      - name: Run TypeScript tests
        run: npm test
      - name: Build core, web app and SDK consumer
        run: npm run build
      - name: Execute SDK consumer example
        run: npm run start --workspace @psa/example-consumer
