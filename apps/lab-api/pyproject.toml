[project]
name = "psa-lab-api"
version = "0.1.0"
description = "Loopback-only password storage and synthetic attack laboratory"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi==0.162.5",
  "uvicorn==0.54.0",
  "argon2-cffi==25.1.0",
  "bcrypt==5.0.0",
  "pydantic==2.14.4",
  "psutil==7.2.2",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
